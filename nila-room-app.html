<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NILA ROOM</title>
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nila Room">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@100;200;300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080808; --bg2:#101010; --surface:#181818; --surface2:#222;
  --gold:#c9a55a; --gold2:#e8c87a; --gold-dim:rgba(201,165,90,0.16);
  --text:#f0ead8; --text-dim:rgba(240,234,216,0.55); --text-muted:rgba(240,234,216,0.3);
  --vip:#a78bfa; --vip-dim:rgba(167,139,250,0.15);
  --player-h:82px; --r:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Josefin Sans',sans-serif;font-weight:200;letter-spacing:.06em}

/* AUTH */
#auth-screen{position:fixed;inset:0;z-index:2000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;padding:40px}
.auth-logo{text-align:center}
.auth-logo .big-n{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:96px;color:var(--gold);line-height:1;display:block;text-shadow:0 0 80px rgba(201,165,90,.2)}
.auth-logo .sub{font-size:9px;letter-spacing:.45em;color:var(--text-muted);text-transform:uppercase;display:block;margin-top:10px}
.auth-form{width:100%;max-width:300px;display:flex;flex-direction:column;gap:14px}
.auth-form input{background:var(--surface);border:1px solid rgba(201,165,90,.18);border-radius:12px;color:var(--text);font-family:'Josefin Sans',sans-serif;font-size:14px;font-weight:200;letter-spacing:.08em;padding:15px 18px;outline:none;transition:border-color .2s;width:100%}
.auth-form input:focus{border-color:var(--gold)}
.auth-form input::placeholder{color:var(--text-muted)}
.btn-auth{background:var(--gold);border:none;border-radius:12px;color:#080808;font-family:'Josefin Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;padding:16px;cursor:pointer;transition:background .2s}
.btn-auth:hover{background:var(--gold2)}
.auth-error{color:#e07070;font-size:11px;letter-spacing:.1em;text-align:center;min-height:16px}

/* APP */
#app{display:none;flex-direction:column;height:100%;height:100dvh}
#app.visible{display:flex}

/* HEADER */
header{padding:max(env(safe-area-inset-top),48px) 18px 0;background:var(--bg);flex-shrink:0;z-index:100}
.header-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:6px}
.logo-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:28px;font-weight:300;color:var(--gold)}
.header-right{display:flex;align-items:center;gap:12px}
.vip-pill{display:none;font-size:9px;letter-spacing:.22em;color:var(--vip);border:1px solid rgba(167,139,250,.35);padding:4px 10px;border-radius:20px}
.vip-pill.show{display:block}
.btn-logout{background:none;border:none;color:var(--text-muted);font-size:19px;cursor:pointer;transition:color .2s;line-height:1}
.btn-logout:hover{color:var(--gold)}
.search-wrap{position:relative;padding:14px 0 10px}
.search-wrap input{width:100%;background:var(--surface);border:1px solid rgba(255,255,255,.07);border-radius:12px;color:var(--text);font-family:'Josefin Sans',sans-serif;font-size:13px;font-weight:200;letter-spacing:.08em;padding:12px 16px 12px 40px;outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:rgba(201,165,90,.3)}
.search-wrap input::placeholder{color:var(--text-muted)}
.s-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:15px}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.fpill{flex-shrink:0;background:var(--surface);border:1px solid rgba(255,255,255,.07);border-radius:22px;color:var(--text-dim);font-family:'Josefin Sans',sans-serif;font-size:11px;font-weight:300;letter-spacing:.18em;text-transform:uppercase;padding:7px 16px;cursor:pointer;transition:all .2s}
.fpill.active{background:var(--gold);border-color:var(--gold);color:#080808;font-weight:600}

/* SCROLL */
.main-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px;padding-bottom:calc(var(--player-h) + env(safe-area-inset-bottom) + 24px);scrollbar-width:none}
.main-scroll::-webkit-scrollbar{display:none}

/* CARDS */
#view-home{display:block}
#view-songs{display:none}
.section-lbl{font-size:9px;letter-spacing:.3em;color:var(--text-muted);text-transform:uppercase;padding:16px 0 12px}
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-bottom:8px}
.card{position:relative;border-radius:var(--r);overflow:hidden;cursor:pointer;aspect-ratio:3/4;background:var(--surface2);transition:transform .18s;-webkit-tap-highlight-color:transparent}
.card:active{transform:scale(.97)}
.card.vip-card{border:1px solid rgba(167,139,250,.22)}
.card-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.card:hover .card-img{transform:scale(1.04)}
.card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,.3) 45%,rgba(0,0,0,.04) 100%)}
.card-fav{position:absolute;top:11px;right:11px;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);border:none;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:rgba(255,255,255,.65);transition:all .2s;z-index:2}
.card-fav.faved{color:#e07070;background:rgba(220,80,80,.2)}
.card-vip-badge{position:absolute;top:11px;left:11px;background:rgba(167,139,250,.2);backdrop-filter:blur(6px);border:1px solid rgba(167,139,250,.4);border-radius:20px;padding:3px 9px;font-size:8px;letter-spacing:.2em;color:var(--vip);text-transform:uppercase;z-index:2}
.card-body{position:absolute;bottom:0;left:0;right:0;padding:14px;z-index:1}
.card-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;color:#fff;line-height:1.15;margin-bottom:4px}
.card-count{font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.5);text-transform:uppercase}
.card-hint{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:9px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}

/* SONG LIST */
.songs-header{display:flex;align-items:center;gap:14px;padding:14px 0 16px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:4px}
.btn-back{background:var(--surface);border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:16px;cursor:pointer;transition:all .2s;flex-shrink:0}
.btn-back:hover{background:var(--gold-dim);color:var(--gold)}
.sh-info{flex:1;min-width:0}
.sh-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;font-weight:300;color:var(--text)}
.sh-count{font-size:9px;letter-spacing:.22em;color:var(--text-muted);text-transform:uppercase;margin-top:3px}
.btn-play-all{background:var(--gold);border:none;border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;color:#080808;font-size:15px;cursor:pointer;transition:all .2s;flex-shrink:0}
.btn-play-all:hover{background:var(--gold2);transform:scale(1.05)}

.song-row{display:flex;align-items:center;gap:13px;padding:11px 6px;border-bottom:1px solid rgba(255,255,255,.045);cursor:pointer;transition:background .15s;border-radius:10px;margin:0 -6px}
.song-row:hover{background:rgba(201,165,90,.05)}
.song-row.playing{background:rgba(201,165,90,.08)}
.song-row.no-audio{opacity:.38;cursor:default}
.song-num{width:20px;text-align:right;flex-shrink:0;font-size:11px;color:var(--text-muted)}
.song-row.playing .song-num{display:none}
.wave-mini{display:none;align-items:flex-end;gap:2px;height:14px;width:16px;flex-shrink:0}
.song-row.playing .wave-mini{display:flex}
.wm{width:2.5px;background:var(--gold);border-radius:1px;animation:wv .7s ease-in-out infinite}
.wm:nth-child(2){animation-delay:.15s}
.wm:nth-child(3){animation-delay:.3s}
@keyframes wv{0%,100%{height:3px}50%{height:13px}}
.song-thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--surface2);flex-shrink:0}
.song-info{flex:1;min-width:0}
.song-title{font-size:13px;font-weight:300;letter-spacing:.06em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.song-row.playing .song-title{color:var(--gold)}
.song-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.song-lang{font-size:8px;letter-spacing:.2em;color:var(--text-muted);text-transform:uppercase}
.tag{font-size:7.5px;letter-spacing:.15em;padding:2px 7px;border-radius:10px;text-transform:uppercase}
.tag-final{background:rgba(201,165,90,.12);color:var(--gold)}
.tag-vip{background:var(--vip-dim);color:var(--vip)}
.tag-noaudio{background:rgba(255,255,255,.05);color:var(--text-muted)}
.tag-exp{background:rgba(100,210,160,.1);color:#6dcba0}
.song-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.btn-fav-row{background:none;border:none;cursor:pointer;font-size:17px;color:var(--text-muted);padding:4px;transition:color .15s,transform .15s}
.btn-fav-row.faved{color:#e07070}
.btn-fav-row:active{transform:scale(1.3)}
.btn-lyrics-row{background:none;border:none;cursor:pointer;font-size:13px;color:var(--text-muted);padding:4px;transition:color .15s}
.btn-lyrics-row:hover{color:var(--gold)}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state .icon{font-size:30px;margin-bottom:12px;opacity:.5}
.empty-state p{font-size:11px;letter-spacing:.15em;line-height:2}

/* PLAYER */
#player{position:fixed;bottom:0;left:0;right:0;height:calc(var(--player-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(18,18,18,.97);border-top:1px solid rgba(201,165,90,.12);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);z-index:300;flex-shrink:0}
.prog-bar{height:3px;background:rgba(255,255,255,.08);cursor:pointer}
.prog-fill{height:100%;background:var(--gold);width:0%;transition:width .5s linear;pointer-events:none}
.player-inner{display:flex;align-items:center;gap:13px;padding:0 16px;height:var(--player-h)}
.p-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--surface2);flex-shrink:0;cursor:pointer}
.p-info{flex:1;min-width:0}
.p-title{font-size:13px;font-weight:300;letter-spacing:.07em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.p-artist{font-size:9px;letter-spacing:.18em;color:var(--text-muted);text-transform:uppercase;margin-top:3px}
.p-controls{display:flex;align-items:center;gap:14px;flex-shrink:0}
.btn-skip{background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;padding:4px;transition:color .2s}
.btn-skip:hover{color:var(--gold)}
.btn-play-p{width:46px;height:46px;border-radius:50%;background:var(--gold);border:none;color:#080808;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .1s;flex-shrink:0}
.btn-play-p:active{transform:scale(.92)}
.btn-play-p:hover{background:var(--gold2)}
.p-time{font-size:9px;letter-spacing:.08em;color:var(--text-muted);min-width:58px;text-align:right}

/* MODAL */
#modal-overlay{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:flex-end;justify-content:center}
#modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid rgba(201,165,90,.12);border-bottom:none;border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:88vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);animation:slideUp .32s cubic-bezier(.32,.72,0,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:rgba(255,255,255,.12);border-radius:2px;margin:12px auto 0;flex-shrink:0}
.modal-head{padding:16px 20px 12px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.m-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;font-style:italic;color:var(--text);line-height:1.2}
.m-artist{font-size:9px;letter-spacing:.25em;color:var(--text-muted);text-transform:uppercase;margin-top:5px}
.btn-close-m{background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;line-height:1;flex-shrink:0;padding:2px;transition:color .2s}
.btn-close-m:hover{color:var(--text)}
.ver-tabs{display:flex;gap:8px;padding:10px 20px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.06)}
.ver-tabs::-webkit-scrollbar{display:none}
.ver-tab{flex-shrink:0;background:none;border:1px solid rgba(201,165,90,.18);border-radius:20px;color:var(--text-dim);font-family:'Josefin Sans',sans-serif;font-size:9px;font-weight:300;letter-spacing:.2em;text-transform:uppercase;padding:5px 13px;cursor:pointer;transition:all .2s}
.ver-tab.active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold)}
.lang-tabs{display:flex;flex-shrink:0;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.06)}
.lang-tab{background:none;border:none;color:var(--text-muted);font-family:'Josefin Sans',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.lang-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.modal-body{flex:1;overflow-y:auto;padding:22px;scrollbar-width:thin;scrollbar-color:rgba(201,165,90,.2) transparent}
.lyrics-block{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:300;line-height:2;color:var(--text);white-space:pre-wrap;display:none}
.lyrics-block.active{display:block}
.lyrics-empty{color:var(--text-muted);font-size:12px;letter-spacing:.12em;text-align:center;padding:40px 0;font-family:'Josefin Sans',sans-serif}
.modal-vote-bar{padding:14px 20px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px;flex-shrink:0}
.vote-lbl{font-size:9px;letter-spacing:.2em;color:var(--text-muted);text-transform:uppercase;flex:1}
.btn-vote{background:none;border:1px solid rgba(201,165,90,.22);border-radius:20px;color:var(--text-dim);font-family:'Josefin Sans',sans-serif;font-size:9px;letter-spacing:.15em;text-transform:uppercase;padding:7px 16px;cursor:pointer;transition:all .2s}
.btn-vote.voted{background:var(--gold-dim);border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-logo">
    <span class="big-n">N</span>
    <span class="sub">Nila Room · Private</span>
  </div>
  <div class="auth-form">
    <input type="email" id="auth-email" placeholder="Email" autocomplete="email">
    <input type="password" id="auth-password" placeholder="Mot de passe" autocomplete="current-password">
    <button class="btn-auth" onclick="doLogin()">Entrer</button>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="header-top">
      <div class="logo-text">Nila Room</div>
      <div class="header-right">
        <span class="vip-pill" id="vip-pill">VIP</span>
        <button class="btn-logout" onclick="doLogout()">⎋</button>
      </div>
    </div>
    <div class="search-wrap">
      <span class="s-icon">⌕</span>
      <input type="search" id="search-input" placeholder="Rechercher un titre..." oninput="onSearch()">
    </div>
    <div class="filter-row" id="filter-row">
      <button class="fpill active" onclick="setFilter('all',this)">Toutes</button>
      <button class="fpill" onclick="setFilter('fav',this)">♥ Favoris</button>
      <button class="fpill" onclick="setFilter('final',this)">Finals</button>
      <button class="fpill" onclick="setFilter('FR',this)">Français</button>
      <button class="fpill" onclick="setFilter('EN',this)">English</button>
      <button class="fpill" onclick="setFilter('ES',this)">Español</button>
      <button class="fpill" onclick="setFilter('nila-moha',this)">Nila Moha</button>
      <button class="fpill" onclick="setFilter('nnbh',this)">NNBH</button>
    </div>
  </header>

  <div class="main-scroll">
    <div id="view-home">
      <div class="section-lbl">Collections</div>
      <div class="cards-grid" id="cards-grid"></div>
    </div>
    <div id="view-songs">
      <div class="songs-header">
        <button class="btn-back" onclick="goHome()">←</button>
        <div class="sh-info">
          <div class="sh-title" id="list-title"></div>
          <div class="sh-count" id="list-count"></div>
        </div>
        <button class="btn-play-all" onclick="playAll()">▶</button>
      </div>
      <div id="song-list"></div>
    </div>
  </div>

  <div id="player">
    <div class="prog-bar" id="prog-bar" onclick="seekAudio(event)">
      <div class="prog-fill" id="prog-fill"></div>
    </div>
    <div class="player-inner">
      <img class="p-thumb" id="p-thumb" src="" alt="" onclick="openLyricsForCurrent()">
      <div class="p-info">
        <div class="p-title" id="p-title">— Nila Room —</div>
        <div class="p-artist" id="p-artist"></div>
      </div>
      <div class="p-controls">
        <button class="btn-skip" onclick="playPrev()">⏮</button>
        <button class="btn-play-p" id="btn-play" onclick="togglePlay()">▶</button>
        <button class="btn-skip" onclick="playNext()">⏭</button>
      </div>
      <div class="p-time" id="p-time">0:00</div>
    </div>
  </div>
</div>

<div id="modal-overlay" onclick="closeModalOnBg(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-head">
      <div>
        <div class="m-title" id="m-title"></div>
        <div class="m-artist" id="m-artist"></div>
      </div>
      <button class="btn-close-m" onclick="closeModal()">✕</button>
    </div>
    <div class="ver-tabs" id="ver-tabs" style="display:none"></div>
    <div class="lang-tabs" id="lang-tabs"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-vote-bar" id="modal-vote">
      <span class="vote-lbl">Version préférée</span>
      <button class="btn-vote" id="btn-vote" onclick="toggleVote()">★ Voter</button>
    </div>
  </div>
</div>

let currentUser=null,isVIP=false,favorites={},votes={};
let currentFilter='all',searchQ='';
let audio=new Audio(),currentSongIndex=-1,currentPlaylist=[],isPlaying=false;
let currentModalSong=null,currentCollection=null;

auth.onAuthStateChanged(async user=>{
  if(user){
    currentUser=user;
    isVIP=(user.email==='nicholeshuber@gmail.com');
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('app').classList.add('visible');
    document.getElementById('vip-pill').classList.toggle('show',isVIP);
    await loadUserData();
    renderCards();
  } else {
    document.getElementById('auth-screen').style.display='flex';
    document.getElementById('app').classList.remove('visible');
  }
});

async function doLogin(){
  const e=document.getElementById('auth-email').value.trim();
  const p=document.getElementById('auth-password').value;
  const err=document.getElementById('auth-error');
  err.textContent='';
  try{ await auth.signInWithEmailAndPassword(e,p); }
  catch(x){ err.textContent='Email ou mot de passe incorrect.'; }
}
document.getElementById('auth-password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
function doLogout(){ audio.pause(); audio.src=''; auth.signOut(); }

async function loadUserData(){
  try{
    const snap=await db.collection('users').doc(currentUser.uid).get();
    if(snap.exists){ const d=snap.data(); favorites=d.favorites||{}; votes=d.votes||{}; }
  }catch(e){}
}
async function saveUserData(){
  try{ await db.collection('users').doc(currentUser.uid).set({favorites,votes},{merge:true}); }
  catch(e){}
}

function goHome(){
  currentCollection=null;
  document.getElementById('view-home').style.display='block';
  document.getElementById('view-songs').style.display='none';
  document.getElementById('filter-row').style.display='flex';
  document.getElementById('search-input').value='';
  searchQ='';
  renderCards();
}

function openCollection(coll){
  currentCollection=coll;
  document.getElementById('view-home').style.display='none';
  document.getElementById('view-songs').style.display='block';
  document.getElementById('filter-row').style.display='none';
  let songs=SONGS.filter(coll.filter);
  if(coll.vip&&!isVIP) songs=[];
  if(!isVIP) songs=songs.filter(s=>!s.vip);
  document.getElementById('list-title').textContent=coll.label;
  document.getElementById('list-count').textContent=songs.length+' titre'+(songs.length>1?'s':'');
  currentPlaylist=songs.filter(s=>s.file);
  renderSongList(songs);
}
function playAll(){ if(currentPlaylist.length>0) playSong(0); }

function renderCards(){
  const grid=document.getElementById('cards-grid');

  if(currentFilter==='fav'){
    document.getElementById('view-home').style.display='none';
    document.getElementById('view-songs').style.display='block';
    let songs=SONGS.filter(s=>favorites[s.id]);
    if(!isVIP) songs=songs.filter(s=>!s.vip);
    document.getElementById('list-title').textContent='♥ Favoris';
    document.getElementById('list-count').textContent=songs.length+' titre'+(songs.length>1?'s':'');
    currentPlaylist=songs.filter(s=>s.file);
    renderSongList(songs);
    return;
  }

  if(searchQ.length>1){
    const q=searchQ.toLowerCase();
    let results=SONGS.filter(s=>s.title.toLowerCase().includes(q)||s.aLabel.toLowerCase().includes(q));
    if(!isVIP) results=results.filter(s=>!s.vip);
    document.getElementById('view-home').style.display='none';
    document.getElementById('view-songs').style.display='block';
    document.getElementById('list-title').textContent='Résultats';
    document.getElementById('list-count').textContent=results.length+' titre'+(results.length>1?'s':'');
    currentPlaylist=results.filter(s=>s.file);
    renderSongList(results);
    return;
  }

  document.getElementById('view-home').style.display='block';
  document.getElementById('view-songs').style.display='none';

  let colls=COLLECTIONS;
  const fmap={FR:'fr',EN:'en',ES:'es','nila-moha':'nila-moha',nnbh:'nnbh',final:'finals'};
  if(currentFilter!=='all'){ const cid=fmap[currentFilter]; if(cid) colls=COLLECTIONS.filter(c=>c.id===cid); }

  grid.innerHTML=colls.map(coll=>{
    let songs=SONGS.filter(coll.filter);
    if(!isVIP) songs=songs.filter(s=>!s.vip);
    const count=coll.vip&&!isVIP?'🔒':songs.length;
    const isFav=favorites['coll_'+coll.id];
    return `<div class="card ${coll.vip?'vip-card':''}" onclick="openCollection(COLLECTIONS.find(c=>c.id==='${coll.id}'))">
      <img class="card-img" src="${coll.cover}" alt="${coll.label}" loading="lazy">
      <div class="card-overlay"></div>
      ${coll.vip?`<div class="card-vip-badge">VIP</div>`:''}
      <button class="card-fav ${isFav?'faved':''}" onclick="event.stopPropagation();toggleCollFav('${coll.id}',this)">${isFav?'♥':'♡'}</button>
      <div class="card-body">
        <div class="card-title">${coll.label}</div>
        <div class="card-count">${count} titre${typeof count==='number'&&count>1?'s':''}</div>
        <div class="card-hint">▶ Écouter</div>
      </div>
    </div>`;
  }).join('');
}

function toggleCollFav(collId,btn){
  const k='coll_'+collId;
  favorites[k]=!favorites[k];
  btn.classList.toggle('faved',favorites[k]);
  btn.textContent=favorites[k]?'♥':'♡';
  saveUserData();
}

function renderSongList(songs){
  const list=document.getElementById('song-list');
  if(!songs.length){
    list.innerHTML=`<div class="empty-state"><div class="icon">♪</div><p>Aucun titre disponible<br>dans cette collection.</p></div>`;
    return;
  }
  list.innerHTML=songs.map((s,i)=>{
    const playing=currentSongIndex>=0&&currentPlaylist[currentSongIndex]?.id===s.id&&isPlaying;
    const isFav=favorites[s.id];
    const hasAudio=!!s.file;
    const hasLyrics=s.lyrics&&Object.values(s.lyrics).some(v=>v);
    return `<div class="song-row ${playing?'playing':''} ${!hasAudio?'no-audio':''}" id="row-${s.id}" onclick="${hasAudio?`playSongById('${s.id}')`:''}" >
      <div class="song-num">${i+1}</div>
      <div class="wave-mini"><div class="wm"></div><div class="wm"></div><div class="wm"></div></div>
      <img class="song-thumb" src="${s.cover}" alt="${s.title}" loading="lazy">
      <div class="song-info">
        <div class="song-title">${s.title}</div>
        <div class="song-meta">
          <span class="song-lang">${s.lang}</span>
          ${s.final?`<span class="tag tag-final">Final</span>`:''}
          ${s.vip?`<span class="tag tag-vip">VIP</span>`:''}
          ${s.exp?`<span class="tag tag-exp">EXP</span>`:''}
          ${!hasAudio?`<span class="tag tag-noaudio">bientôt</span>`:''}
        </div>
      </div>
      <div class="song-actions">
        ${hasLyrics?`<button class="btn-lyrics-row" onclick="event.stopPropagation();openModal('${s.id}')" title="Paroles">✦</button>`:''}
        <button class="btn-fav-row ${isFav?'faved':''}" onclick="event.stopPropagation();toggleFav('${s.id}',this)">${isFav?'♥':'♡'}</button>
      </div>
    </div>`;
  }).join('');
}

function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.fpill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  searchQ='';
  document.getElementById('search-input').value='';
  renderCards();
}
function onSearch(){ searchQ=document.getElementById('search-input').value.trim(); renderCards(); }
function toggleFav(id,btn){
  favorites[id]=!favorites[id];
  btn.classList.toggle('faved',favorites[id]);
  btn.textContent=favorites[id]?'♥':'♡';
  saveUserData();
}

// AUDIO
function playSongById(id){
  const idx=currentPlaylist.findIndex(s=>s.id===id);
  if(idx>=0) playSong(idx);
  else{ const s=SONGS.find(x=>x.id===id); if(s&&s.file){currentPlaylist=[s];playSong(0);} }
}
function playSong(idx){
  if(idx<0||idx>=currentPlaylist.length) return;
  currentSongIndex=idx;
  const s=currentPlaylist[idx];
  audio.src=s.file; audio.load();
  audio.play().then(()=>{ isPlaying=true; updatePlayerUI(s); updatePlayBtn(); updateRowHighlight(); })
    .catch(()=>{ isPlaying=false; updatePlayBtn(); });
}
function togglePlay(){ if(!audio.src) return; if(isPlaying){audio.pause();isPlaying=false;}else{audio.play();isPlaying=true;} updatePlayBtn(); }
function playNext(){ if(!currentPlaylist.length) return; playSong((currentSongIndex+1)%currentPlaylist.length); }
function playPrev(){ if(audio.currentTime>3){audio.currentTime=0;return;} if(!currentPlaylist.length) return; playSong((currentSongIndex-1+currentPlaylist.length)%currentPlaylist.length); }
audio.addEventListener('ended',playNext);
audio.addEventListener('timeupdate',()=>{
  if(!audio.duration) return;
  document.getElementById('prog-fill').style.width=(audio.currentTime/audio.duration*100)+'%';
  document.getElementById('p-time').textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration);
});
audio.addEventListener('pause',()=>{isPlaying=false;updatePlayBtn();});
audio.addEventListener('play',()=>{isPlaying=true;updatePlayBtn();});
function fmt(s){ if(!s||isNaN(s)) return '0:00'; return Math.floor(s/60)+':'+(Math.floor(s%60)<10?'0':'')+Math.floor(s%60); }
function seekAudio(e){ if(!audio.duration) return; const r=document.getElementById('prog-bar').getBoundingClientRect(); audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration; }
function updatePlayerUI(s){ document.getElementById('p-thumb').src=s.cover; document.getElementById('p-title').textContent=s.title; document.getElementById('p-artist').textContent=s.aLabel; }
function updatePlayBtn(){ document.getElementById('btn-play').textContent=isPlaying?'⏸':'▶'; }
function updateRowHighlight(){
  document.querySelectorAll('.song-row').forEach(r=>r.classList.remove('playing'));
  const s=currentPlaylist[currentSongIndex];
  if(s){ const row=document.getElementById('row-'+s.id); if(row){row.classList.add('playing');row.scrollIntoView({behavior:'smooth',block:'nearest'});} }
}

// MODAL
function openModal(songId){
  const s=SONGS.find(x=>x.id===songId); if(!s) return;
  currentModalSong=s;
  document.getElementById('m-title').textContent=s.title;
  document.getElementById('m-artist').textContent=s.aLabel;
  buildVersionTabs(s); buildLangTabs(s); buildVoteBar(s);
  document.getElementById('modal-overlay').classList.add('open');
}
function openLyricsForCurrent(){ if(currentSongIndex>=0&&currentPlaylist[currentSongIndex]) openModal(currentPlaylist[currentSongIndex].id); }
function buildVersionTabs(s){
  const el=document.getElementById('ver-tabs');
  if(!s.versions){el.style.display='none';return;}
  el.style.display='flex';
  el.innerHTML=s.versions.map((v,i)=>`<button class="ver-tab ${i===0?'active':''}" onclick="switchVersion(${i},this)">${v.label}</button>`).join('');
}
function switchVersion(idx,btn){
  document.querySelectorAll('.ver-tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
  if(!currentModalSong?.versions) return;
  const wasPlaying=isPlaying;
  if(currentPlaylist[currentSongIndex]?.id===currentModalSong.id){
    audio.src=currentModalSong.versions[idx].file; audio.load(); if(wasPlaying) audio.play();
  }
}
function buildLangTabs(s){
  const tabs=document.getElementById('lang-tabs'), body=document.getElementById('modal-body');
  const lyrics=s.lyrics||{}, langs=Object.keys(lyrics);
  if(!langs.length){ tabs.innerHTML=''; body.innerHTML=`<div class="lyrics-empty">Paroles non disponibles.</div>`; return; }
  tabs.innerHTML=langs.map((l,i)=>`<button class="lang-tab ${i===0?'active':''}" onclick="switchLang(${i},this)">${l}</button>`).join('');
  body.innerHTML=langs.map((l,i)=>{
    const txt=lyrics[l];
    return `<div class="lyrics-block ${i===0?'active':''}">${txt||`<div class="lyrics-empty">Paroles en ${l} bientôt disponibles.</div>`}</div>`;
  }).join('');
}
function switchLang(idx,btn){
  document.querySelectorAll('.lang-tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.lyrics-block').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.lyrics-block')[idx]?.classList.add('active');
}
function buildVoteBar(s){
  const btn=document.getElementById('btn-vote');
  const voted=votes[s.id];
  btn.classList.toggle('voted',!!voted);
  btn.textContent=voted?'★ Version votée':'★ Voter cette version';
}
function toggleVote(){
  if(!currentModalSong) return;
  votes[currentModalSong.id]=!votes[currentModalSong.id];
  const btn=document.getElementById('btn-vote');
  btn.classList.toggle('voted',votes[currentModalSong.id]);
  btn.textContent=votes[currentModalSong.id]?'★ Version votée':'★ Voter cette version';
  saveUserData();
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); currentModalSong=null; }
function closeModalOnBg(e){ if(e.target===document.getElementById('modal-overlay')) closeModal(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); if(e.key===' '&&!e.target.matches('input')){e.preventDefault();togglePlay();} });
</script>
</body>
</html>
